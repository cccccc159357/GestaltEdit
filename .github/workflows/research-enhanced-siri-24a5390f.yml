name: Research Enhanced Siri Reason 24A5390f

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  analyze:
    runs-on: xcode-27
    timeout-minutes: 240

    steps:
      - name: Locate exact iOS 27.0 (24A5390f) simulator runtime
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          echo "--- runtime list JSON ---"
          xcrun simctl runtime list -j > "$RUNNER_TEMP/runtime-list.json" 2>/dev/null || true
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/runtimes.json" 2>/dev/null || true
          head -c 1200 "$RUNNER_TEMP/runtimes.json" 2>/dev/null || true
          echo ""
          runtime_root=""
          if command -v python3 >/dev/null 2>&1; then
            runtime_root="$(python3 - "$RUNNER_TEMP/runtimes.json" <<'PY'
          import json, os, sys
          path = sys.argv[1]
          try:
              with open(path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
          except Exception as e:
              print(f'parse-error: {e}', file=sys.stderr)
              sys.exit(0)
          for r in data.get('runtimes', []):
              if (r.get('identifier') == 'com.apple.CoreSimulator.SimRuntime.iOS-27-0'
                      and r.get('buildversion') == '24A5390f'
                      and r.get('isAvailable')):
                  root = r.get('runtimeRoot')
                  if not root:
                      b = r.get('bundlePath')
                      if b:
                          root = os.path.join(b, 'Contents', 'Resources', 'RuntimeRoot')
                  if root and os.path.isdir(root):
                      print(root)
                      sys.exit(0)
          sys.exit(0)
          PY
          )"
          fi
          if [ -z "$runtime_root" ]; then
            echo "Falling back to simctl runtime list -j"
            if command -v python3 >/dev/null 2>&1; then
              runtime_root="$(python3 - "$RUNNER_TEMP/runtime-list.json" <<'PY'
          import json, os, sys
          path = sys.argv[1]
          try:
              with open(path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
          except Exception:
              sys.exit(0)
          for r in data.values():
              if (r.get('runtimeIdentifier') == 'com.apple.CoreSimulator.SimRuntime.iOS-27-0'
                      and r.get('build') == '24A5390f'):
                  b = r.get('runtimeBundlePath')
                  if b:
                      root = os.path.join(b, 'Contents', 'Resources', 'RuntimeRoot')
                      if os.path.isdir(root):
                          print(root)
                          sys.exit(0)
          sys.exit(0)
          PY
          )"
            fi
          fi
          if [ -z "$runtime_root" ]; then
            echo "Falling back to filesystem search"
            while IFS= read -r sim; do
              root="$sim/Contents/Resources/RuntimeRoot"
              if [ -d "$root" ] && [ -f "$root/System/Library/PrivateFrameworks/GenerativeModels.framework/GenerativeModels" ]; then
                runtime_root="$root"
                break
              fi
            done < <(find /Library/Developer /private/var/run /System/Library/AssetsV2 -iname "*.simruntime" -print 2>/dev/null || true)
          fi
          if [ -n "$runtime_root" ]; then
            echo "RUNTIME_ROOT=$runtime_root" >> "$GITHUB_ENV"
            echo "Using exact iOS 27.0 (24A5390f) runtime root: $runtime_root"
            echo "SystemVersion.plist:"
            plutil -p "$runtime_root/System/Library/CoreServices/SystemVersion.plist" 2>/dev/null | head -30 || true
          else
            echo "::warning::Exact iOS simulator runtime not found; continuing with ipsw-diffs only."
            echo "RUNTIME_ROOT=" >> "$GITHUB_ENV"
          fi

      - name: Sparse clone exact-build ipsw-diffs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/research"
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/blacktop/ipsw-diffs.git \
            "$RUNNER_TEMP/research/ipsw-diffs"
          cd "$RUNNER_TEMP/research/ipsw-diffs"
          git sparse-checkout set \
            27_0_24A5380h_vs_27_0_24A5390f \
            27_0_24A5390f_vs_27_0_24A5408d \
            26_5_23F77_vs_27_0_24A5355q

      - name: Grep exact-build ipsw-diffs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/analysis"
          cd "$RUNNER_TEMP/research/ipsw-diffs"
          grep -RInE \
            "com\.apple\.gms\.enhancedSiri|pendingEnrollment|forcedWaitlistStatus|SOLinwoodAvailability|AFSiriUnavailability|SiriModePolicy|DeviceSiriMode|HasLinwood|enhancedSiri\.reasons|linwoodAvailability|UnifiedReason|UnavailableReason|RestrictedReason|essentialAssetReadiness|Enhanced Siri returning|Unknown Enhanced Siri reason" \
            --include="*.md" . \
            > "$RUNNER_TEMP/analysis/ipsw-diffs-hits.txt" || true
          wc -l "$RUNNER_TEMP/analysis/ipsw-diffs-hits.txt"

      - name: Install ipsw
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/analysis" "$RUNNER_TEMP/bin" "$RUNNER_TEMP/extracted"
          if command -v brew >/dev/null 2>&1; then
            brew install blacktop/tap/ipsw >/tmp/ipsw-install.log 2>&1 || \
              brew install ipsw >>/tmp/ipsw-install.log 2>&1 || true
          fi
          if command -v ipsw >/dev/null 2>&1; then
            ipsw version > "$RUNNER_TEMP/analysis/ipsw-version.txt" 2>&1 || true
            echo "ipsw=$(command -v ipsw)"
            exit 0
          fi
          echo "Brew install failed, downloading release binary"
          curl -fsSL https://api.github.com/repos/blacktop/ipsw/releases/latest \
            -o "$RUNNER_TEMP/ipsw-release.json"
          asset="$(python3 - "$RUNNER_TEMP/ipsw-release.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          for a in d['assets']:
              if a['name'].endswith('macOS_arm64.tar.gz'):
                  print(a['name'])
                  sys.exit(0)
          sys.exit(1)
          PY
          )"
          curl -fL "https://github.com/blacktop/ipsw/releases/latest/download/$asset" \
            -o "$RUNNER_TEMP/ipsw.tar.gz"
          tar -xzf "$RUNNER_TEMP/ipsw.tar.gz" -C "$RUNNER_TEMP/bin" || true
          find "$RUNNER_TEMP/bin" -type f -name ipsw -exec chmod +x {} \; 2>/dev/null || true
          ipsw_path="$(find "$RUNNER_TEMP/bin" -type f -name ipsw | head -1)"
          if [ -z "$ipsw_path" ]; then
            echo "ipsw not installed; using strings/nm/otool evidence only." \
              > "$RUNNER_TEMP/analysis/ipsw-unavailable.txt"
            exit 0
          fi
          ipsw_dir="$(dirname "$ipsw_path")"
          echo "PATH=$ipsw_dir:$PATH" >> "$GITHUB_ENV"
          echo "Installed ipsw at $ipsw_path"

      - name: Collect exact-build simulator binaries and extract missing dylibs
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/analysis/binaries.txt"
          : > "$RUNNER_TEMP/analysis/missing.txt"
          : > "$RUNNER_TEMP/analysis/extract.log"
          if [ -z "$RUNTIME_ROOT" ]; then
            echo "No simulator runtime root; no simulator binaries available." \
              > "$RUNNER_TEMP/analysis/missing.txt"
            echo "Found binaries:"
            cat "$RUNNER_TEMP/analysis/binaries.txt"
            echo "Missing:"
            cat "$RUNNER_TEMP/analysis/missing.txt"
            exit 0
          fi
          bin_rels=(
            "System/Library/PrivateFrameworks/GenerativeModels.framework/GenerativeModels"
            "System/Library/PrivateFrameworks/GenerativeExperiencesRuntime.framework/GenerativeExperiencesRuntime"
            "System/Library/PrivateFrameworks/AssistantServices.framework/AssistantServices"
            "System/Library/PrivateFrameworks/SiriAvailability.framework/SiriAvailability"
            "System/Library/PrivateFrameworks/SiriActivationFoundation.framework/SiriActivationFoundation"
            "System/Library/PrivateFrameworks/SiriSetup.framework/SiriSetup"
            "usr/libexec/eligibilityd"
            "System/Library/PrivateFrameworks/AssistantServices.framework/assistantd"
          )
          for rel in "${bin_rels[@]}"; do
            bin="$RUNTIME_ROOT/$rel"
            if [ -f "$bin" ]; then
              echo "$bin" >> "$RUNNER_TEMP/analysis/binaries.txt"
            else
              echo "$rel" >> "$RUNNER_TEMP/analysis/missing.txt"
            fi
          done
          echo "Found binaries:"
          cat "$RUNNER_TEMP/analysis/binaries.txt"
          echo "Missing binaries:"
          cat "$RUNNER_TEMP/analysis/missing.txt"
          echo "--- framework dir listing for missing paths ---"
          for rel in $(cat "$RUNNER_TEMP/analysis/missing.txt"); do
            dir="$(dirname "$RUNTIME_ROOT/$rel")"
            if [ -d "$dir" ]; then
              ls -la "$dir" >> "$RUNNER_TEMP/analysis/extract.log" || true
            fi
          done
          echo "--- dyld caches in runtime root ---"
          find "$RUNTIME_ROOT" -name "dyld_shared_cache*" -print \
            > "$RUNNER_TEMP/analysis/dyld-caches.txt" 2>/dev/null || true
          cat "$RUNNER_TEMP/analysis/dyld-caches.txt" || true
          if command -v ipsw >/dev/null 2>&1 && [ -s "$RUNNER_TEMP/analysis/dyld-caches.txt" ] && [ -s "$RUNNER_TEMP/analysis/missing.txt" ]; then
            cache="$(head -1 "$RUNNER_TEMP/analysis/dyld-caches.txt")"
            echo "--- extracting missing dylibs from $cache ---"
            while IFS= read -r rel; do
              name="$(basename "$rel")"
              mkdir -p "$RUNNER_TEMP/extracted/$name"
              (
                cd "$RUNNER_TEMP/extracted/$name"
                ipsw dyld extract "$cache" --dylib "$name" >> "$RUNNER_TEMP/analysis/extract.log" 2>&1 || \
                ipsw dyld extract "$cache" --dylib "/System/Library/PrivateFrameworks/$(dirname "$rel" | sed 's|System/Library/PrivateFrameworks/||')/$name" \
                  >> "$RUNNER_TEMP/analysis/extract.log" 2>&1 || true
              )
            done < "$RUNNER_TEMP/analysis/missing.txt"
            find "$RUNNER_TEMP/extracted" -type f \( -perm -111 -o -name "GenerativeModels" -o -name "AssistantServices" -o -name "SiriAvailability" -o -name "SiriActivationFoundation" \) \
              -print >> "$RUNNER_TEMP/analysis/extract.log" || true
            find "$RUNNER_TEMP/extracted" -type f -size +100k \
              -exec sh -c 'file "$1"' _ {} \; >> "$RUNNER_TEMP/analysis/extract.log" || true
          fi
          echo "--- extraction log ---"
          cat "$RUNNER_TEMP/analysis/extract.log" || true
          cp "$RUNNER_TEMP/runtimes.json" "$RUNNER_TEMP/analysis/runtimes.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/runtime-list.json" "$RUNNER_TEMP/analysis/runtime-list.json" 2>/dev/null || true

      - name: Analyze binaries with strings, nm, otool, swift-demangle, ipsw
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/analysis/binaries.txt" ]; then
            echo "No simulator binaries to analyze." \
              > "$RUNNER_TEMP/analysis/no-binaries.txt"
            exit 0
          fi
          demangler="swift-demangle"
          if command -v xcrun >/dev/null 2>&1 && xcrun --find swift-demangle >/dev/null 2>&1; then
            demangler="xcrun swift-demangle"
          fi
          echo "demangler=$demangler"
          while IFS= read -r bin; do
            name="$(basename "$bin")"
            strings -a "$bin" | grep -iE \
              "enhancedSiri|pendingEnrollment|forcedWaitlistStatus|SOLinwood|AFSiriUnavailability|SiriMode|HasLinwood|linwoodAvailability|reasons|GMS" \
              > "$RUNNER_TEMP/analysis/strings-$name.txt" || true
            strings -a -t x "$bin" | grep -iE \
              "enhancedSiri\.reasons|Unknown Enhanced Siri reason|device is still on waitlist|pendingEnrollment|essentialAssetReadiness|com\.apple\.gms\.enhancedSiri" \
              > "$RUNNER_TEMP/analysis/string-offsets-$name.txt" || true
            nm -arch arm64 "$bin" 2>/dev/null | $demangler 2>/dev/null \
              > "$RUNNER_TEMP/analysis/demangled-$name.txt" || true
            grep -iE \
              "UnifiedReason|UnavailableReason|RestrictedReason|pendingEnrollment|essentialAssetReadiness|EnhancedSiri|Linwood|HasLinwood|SiriMode|Reason|Availability" \
              "$RUNNER_TEMP/analysis/demangled-$name.txt" \
              > "$RUNNER_TEMP/analysis/symbols-$name.txt" || true
            nm -arch arm64 "$bin" 2>/dev/null | awk \
              '$3 ~ /Reason|EnhancedSiri|Linwood|Availability|SiriMode|HasLinwood|GMS/ {print $3}' \
              | head -120 > "$RUNNER_TEMP/analysis/funcs-$name.txt" || true
            otool -ov "$bin" 2>/dev/null | grep -iE \
              "SiriMode|Linwood|Reason|Availability|HasLinwood|enhancedSiri" \
              > "$RUNNER_TEMP/analysis/objc-$name.txt" || true
            : > "$RUNNER_TEMP/analysis/disasm-$name.txt"
            if command -v ipsw >/dev/null 2>&1; then
              while IFS= read -r sym; do
                echo "===== $sym =====" >> "$RUNNER_TEMP/analysis/disasm-$name.txt"
                ipsw macho disass "$bin" --symbol "$sym" \
                  >> "$RUNNER_TEMP/analysis/disasm-$name.txt" 2>&1 || true
              done < "$RUNNER_TEMP/analysis/funcs-$name.txt"
              ipsw macho search "$bin" --string "com.apple.gms.enhancedSiri.reasons" \
                > "$RUNNER_TEMP/analysis/ipsw-search-reasons-$name.txt" 2>&1 || true
              ipsw macho search "$bin" --string "Unknown Enhanced Siri reason code" \
                > "$RUNNER_TEMP/analysis/ipsw-search-unknownreason-$name.txt" 2>&1 || true
              ipsw macho search "$bin" --string "device is still on waitlist" \
                > "$RUNNER_TEMP/analysis/ipsw-search-waitlist-$name.txt" 2>&1 || true
            else
              while IFS= read -r sym; do
                for cand in "$sym" "${sym#_}"; do
                  if otool -tvV -arch arm64 -p "$cand" "$bin" \
                      >> "$RUNNER_TEMP/analysis/disasm-$name.txt" 2>/dev/null; then
                    break
                  fi
                done || true
              done < "$RUNNER_TEMP/analysis/funcs-$name.txt"
            fi
          done < "$RUNNER_TEMP/analysis/binaries.txt"
          ls -lh "$RUNNER_TEMP/analysis"

      - name: Build report and upload artifact
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/analysis/REPORT.md"
          {
            echo "# Enhanced Siri reason research: 24A5390f"
            echo ""
            echo "## Environment"
            echo "- Build: 24A5390f"
            echo "- Runtime root: $RUNTIME_ROOT"
            echo ""
            echo "## Missing binaries"
            cat "$RUNNER_TEMP/analysis/missing.txt" 2>/dev/null || true
            echo ""
            echo "## Binaries analyzed"
            cat "$RUNNER_TEMP/analysis/binaries.txt" 2>/dev/null || true
            echo ""
            echo "## dyld caches"
            cat "$RUNNER_TEMP/analysis/dyld-caches.txt" 2>/dev/null || true
            echo ""
            echo "## Extraction log"
            cat "$RUNNER_TEMP/analysis/extract.log" 2>/dev/null || true
            echo ""
            echo "## ipsw-diffs hits"
            wc -l "$RUNNER_TEMP/analysis/ipsw-diffs-hits.txt" 2>/dev/null || true
            head -100 "$RUNNER_TEMP/analysis/ipsw-diffs-hits.txt" 2>/dev/null || true
            echo ""
            echo "## Key strings"
            head -250 "$RUNNER_TEMP/analysis"/strings-* 2>/dev/null || true
            echo ""
            echo "## String offsets"
            head -100 "$RUNNER_TEMP/analysis"/string-offsets-* 2>/dev/null || true
            echo ""
            echo "## Key symbols"
            head -250 "$RUNNER_TEMP/analysis"/symbols-* 2>/dev/null || true
            echo ""
            echo "## ipsw searches"
            head -200 "$RUNNER_TEMP/analysis"/ipsw-search-* 2>/dev/null || true
            echo ""
            echo "## Disassembly"
            head -500 "$RUNNER_TEMP/analysis"/disasm-* 2>/dev/null || true
            echo ""
            echo "## ipsw version"
            cat "$RUNNER_TEMP/analysis/ipsw-version.txt" 2>/dev/null || true
          } > "$report"
          echo "Report written to $report"

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-enhanced-siri-24A5390f
          path: ${{ runner.temp }}/analysis
          if-no-files-found: error
